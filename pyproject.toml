[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiying"
version = "0.3.0"
description = "把收藏夹里吃灰的视频变成可检索、可问答、可溯源到时间点的视频知识库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhiying-platform" }]
dependencies = [
    "yt-dlp>=2026.10.26",
    "PyYAML>=6.0",
    "requests>=2.31",
    "imageio-ffmpeg>=0.5",
    "scenedetect>=0.7.3",
    "psycopg[binary]>=3.3",
    "jieba>=0.42",
    "fastapi>=0.160",
    "uvicorn[standard]>=0.54",
    "mcp>=2.3",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# 本地 Whisper（第三级转写保底，可选组件）
whisper = ["faster-whisper>=1.2.1"]

[project.scripts]
zhiying = "zhiying.__main__:main"
zhiying-api = "zhiying.api:main"
zhiying-mcp = "zhiying.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
