<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  /* 安装器向导大图（Inno modern: 190x346）——纸白底 + 印章 + 竖排品牌名 + 底部墨线 */
  body{margin:0;width:190px;height:346px;background:#ffffff;display:flex;flex-direction:column;align-items:center;overflow:hidden}
  .paper{position:absolute;inset:0;background:
    radial-gradient(circle at 85% 12%, #eff6ff 0%, transparent 45%),
    linear-gradient(180deg,#ffffff 0%,#f8fafc 100%)}
  .seal{position:relative;margin-top:46px;width:104px;height:104px}
  .word{position:relative;margin-top:26px;writing-mode:vertical-rl;font-family:'SimSun','Microsoft YaHei',serif;
    font-size:26px;letter-spacing:14px;color:#1e293b;font-weight:600}
  .en{position:relative;margin-top:12px;font-family:Arial;font-size:9px;letter-spacing:5px;color:#94a3b8}
  .line{position:relative;margin-top:auto;margin-bottom:0;width:100%;height:6px;background:#2563eb}
  .seal-line{position:relative;width:1px;height:34px;background:#cbd5e1;margin-top:18px}
</style></head><body>
  <div class="paper"></div>
  <img class="seal" src="zhiying-seal.svg">
  <div class="seal-line"></div>
  <div class="word">知映</div>
  <div class="en">ZHIYING</div>
  <div class="line"></div>
</body></html>
